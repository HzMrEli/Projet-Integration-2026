version: "2.0"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

intents:
  - greet
  - goodbye
  - affirm
  - deny

  - start_fridge_mode
  - start_recipe_by_name

  - add_ingredient
  - done_ingredients
  - choose_recipe

  - ask_full_recipe
  - start_step_by_step

  - next_step
  - repeat_step
  - pause_recipe
  - resume_recipe
  - slow_down
  - ask_definition

entities:
  - liste_ingredients
  - nom_recette

slots:
  # --- Slots attendus par src/actions/recipe_actions.py ---
  liste_ingredients:
    type: list
    influence_conversation: true
    auto_fill: true

  nom_recette:
    type: text
    influence_conversation: true
    auto_fill: true

  contraintes:
    type: text
    influence_conversation: true

  temps_max:
    type: float
    influence_conversation: true

  nb_personnes:
    type: float
    influence_conversation: true

  difficulte:
    type: text
    influence_conversation: true

  # --- Slots utilisés par ActionTellRecipeStep ---
  recipe_card:
    type: any
    influence_conversation: false

  recipe_json:
    type: any
    influence_conversation: false

  recipe_steps:
    type: list
    influence_conversation: false
    initial_value: []
  step_index:
    type: float
    influence_conversation: true
    initial_value: 0
  last_step_text:
    type: text
    influence_conversation: false

  speech_rate:
    type: text
    influence_conversation: false
    initial_value: "normal"

responses:
  utter_greet:
    - text: "Bonjour ! Je suis votre assistant culinaire. Que voulez-vous cuisiner ?"

  utter_goodbye:
    - text: "Au revoir ! Bon appétit !"

  utter_ask_ingredients:
    - text: "Quels ingrédients avez-vous dans votre frigo ?"

  utter_ask_ingredients_collect:
    - text: "Listez vos ingrédients (une phrase). Quand vous avez terminé, dites : 'c'est tout'."

  utter_confirm_ingredients:
    - text: "Très bien, j'ai noté : {liste_ingredients}. Quand vous avez terminé, dites : 'c'est tout'."

  utter_ask_full_or_step:
    - text: "Voulez-vous la recette complète, ou un guidage étape par étape ?"

  utter_ask_next:
    - text: "Prêt pour l'étape suivante ? Dites 'suivant' ou 'répète'."

  utter_paused:
    - text: "D'accord, en pause. Dites 'reprends' quand vous êtes prêt."

  utter_resumed:
    - text: "Parfait, continuons."

  utter_slow_confirm:
    - text: "D'accord, je vais parler plus lentement."

  utter_ask_definition:
    - text: "Quel terme voulez-vous que j'explique ?"

  utter_fallback:
    - text: "Désolé, je n'ai pas compris. Vous pouvez répéter ou demander 'aide'."

actions:
  - action_generate_recipe_from_ingredients
  - action_generate_recipe_from_name
  - action_tell_recipe_step
  - action_text_to_speech
  - action_ui_refresh_pronounce_phrase
