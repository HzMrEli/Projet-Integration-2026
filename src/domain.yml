version: "2.0"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

intents:
  - greet
  - goodbye
  - affirm
  - deny

  # Emitted by the NLU FallbackClassifier when confidence is low
  - nlu_fallback

  - start_fridge_mode
  - start_recipe_by_name

  - add_ingredient
  - done_ingredients
  - choose_recipe

  - ask_full_recipe
  - start_step_by_step

  - next_step
  - repeat_step
  - pause_recipe
  - resume_recipe
  - slow_down
  - ask_definition

entities:
  - liste_ingredients
  - nom_recette

slots:
  # --- Slots attendus par src/actions/recipe_actions.py ---
  liste_ingredients:
    type: list
    influence_conversation: true
    auto_fill: true

  nom_recette:
    type: text
    influence_conversation: true
    auto_fill: true

  formatted_ingredients:
    type: text
    influence_conversation: false

  contraintes:
    type: text
    influence_conversation: true

  temps_max:
    type: float
    influence_conversation: true

  nb_personnes:
    type: float
    influence_conversation: true

  difficulte:
    type: text
    influence_conversation: true

  # --- Slots utilisés par ActionTellRecipeStep ---
  recipe_card:
    type: any
    influence_conversation: false

  recipe_json:
    type: any
    influence_conversation: false

  recipe_steps:
    type: list
    influence_conversation: false
    initial_value: []
  step_index:
    type: float
    influence_conversation: true
    initial_value: 0
  last_step_text:
    type: text
    influence_conversation: false


  # --- Slots techniques (TTS / UI) ---
  tts_text:
    type: text
    influence_conversation: false
  texte_a_dire:
    type: text
    influence_conversation: false
  texte:
    type: text
    influence_conversation: false
  tts_last_file:
    type: text
    influence_conversation: false
  ui_event:
    type: any
    influence_conversation: false

responses:
  utter_greet:
    - text: "Bonjour ! Je suis votre assistant culinaire. Que voulez-vous cuisiner ?"

  utter_goodbye:
    - text: "Au revoir ! Bon appétit !"

  utter_ask_ingredients_collect:
    - text: "Quels ingrédients avez-vous ?"

  utter_recipe_ingredients:
    - text: "Très bien, je vous propose de faire le plat {nom_recette} avec {formatted_ingredients}. Cette recette vous convient ?"

  utter_recipe_found_details:
    - text: "Voici la recette de {nom_recette}. Il vous faudra : {formatted_ingredients}. Est-ce que cela vous convient ?"

  utter_ask_full_or_step:
    - text: "Voulez-vous la recette complète, ou un guidage étape par étape ?"

  utter_ask_validate_recipe:
    - text: "Cette recette vous convient ?"

  utter_propose_another_recipe:
    - text: "D'accord, je vous propose une autre recette avec ces ingrédients."

  utter_ask_ready_to_start:
    - text: "Êtes-vous prêt à commencer ?"

  utter_waiting_ready:
    - text: "Pas de souci. Dites 'oui' quand vous êtes prêt à commencer."

  utter_ask_next:
    - text: "Prêt pour l'étape suivante ? Dites 'suivant' ou 'répète'."

  utter_paused:
    - text: "D'accord, en pause. Dites 'reprends' quand vous êtes prêt."

  utter_resumed:
    - text: "Parfait, continuons."

  utter_slow_confirm:
    - text: "D'accord, je vais parler plus lentement."

  utter_ask_definition:
    - text: "Quel terme voulez-vous que j'explique ?"

  utter_fallback:
    - text: "Désolé, je n'ai pas compris. Vous pouvez répéter ou demander 'aide'."

actions:
  - action_generate_recipe_from_ingredients
  - action_generate_recipe_from_name
  - action_tell_recipe_step
  - action_tell_full_recipe
  - action_text_to_speech
  - action_ui_refresh_pronounce_phrase
