version: "2.0"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

intents:
  - greet
  - goodbye
  - affirm
  - deny

  - start_fridge_mode
  - start_recipe_by_name

  - add_ingredient
  - done_ingredients
  - choose_recipe

  - ask_full_recipe
  - start_step_by_step

  - next_step
  - repeat_step
  - pause_recipe
  - resume_recipe
  - slow_down
  - ask_definition

entities:
  - ingredient
  - recipe_name

slots:
  ingredients:
    type: list
    influence_conversation: true
    initial_value: []
  selected_recipe_index:
    type: text
    influence_conversation: true
  candidate_recipes:
    type: list
    influence_conversation: false
    initial_value: []

  recipe_name:
    type: text
    influence_conversation: true
  recipe_steps:
    type: list
    influence_conversation: false
    initial_value: []
  step_index:
    type: float
    influence_conversation: true
    initial_value: 0
  last_step_text:
    type: text
    influence_conversation: false

  speech_rate:
    type: text
    influence_conversation: false
    initial_value: "normal"

responses:
  utter_greet:
    - text: "Bonjour ! Je suis votre assistant culinaire. Que voulez-vous cuisiner ?"

  utter_goodbye:
    - text: "Au revoir ! Bon appétit !"

  utter_ask_ingredients:
    - text: "Quels ingrédients avez-vous dans votre frigo ?"

  utter_ask_ingredients_collect:
    - text: "Listez vos ingrédients (une phrase). Quand vous avez terminé, dites : 'c'est tout'."

  utter_confirm_ingredients:
    - text: "Très bien, j'ai noté vos ingrédients : {ingredients}. Souhaitez-vous que je cherche des recettes ?"

  utter_present_recipes:
    - text: "J'ai trouvé ces idées :\n1) {option1}\n2) {option2}\n3) {option3}\nDites 'option 1', 'option 2', 'option 3' ou le nom de la recette."

  utter_ask_recipe_choice:
    - text: "Quelle option choisissez-vous ? Dites 'option 1', 'option 2', ou 'option 3'."

  utter_ask_full_or_step:
    - text: "Voulez-vous la recette complète, ou un guidage étape par étape ?"

  utter_ask_next:
    - text: "Prêt pour l'étape suivante ? Dites 'suivant' ou 'répète'."

  utter_paused:
    - text: "D'accord, en pause. Dites 'reprends' quand vous êtes prêt."

  utter_resumed:
    - text: "Parfait, continuons."

  utter_slow_confirm:
    - text: "D'accord, je vais parler plus lentement."

  utter_ask_definition:
    - text: "Quel terme voulez-vous que j'explique ?"

  utter_fallback:
    - text: "Désolé, je n'ai pas compris. Vous pouvez répéter ou demander 'aide'."

actions:
  - action_detect_language
  - action_generate_recipe_suggestions
  - action_collect_ingredients
  - action_show_full_recipe
  - action_start_step_by_step
  - action_read_step
  - action_next_step
  - action_repeat_step
  - action_explain_term
