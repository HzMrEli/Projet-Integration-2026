version: "2.0"

nlu:
  - intent: greet
    examples: |
      - hey
      - hello
      - hi
      - good morning
      - good evening

  - intent: goodbye
    examples: |
      - bye
      - goodbye
      - see you later
      - have a nice day

  - intent: affirm
    examples: |
      - yes
      - yep
      - yeah
      - correct
      - ok
      - okay

  - intent: deny
    examples: |
      - no
      - nope
      - not really
      - never

  - intent: start_fridge_mode
    examples: |
      - I want to cook with what I have
      - what can I cook with my ingredients
      - suggest recipes from my fridge
      - use my fridge ingredients
      - what can I make right now

  - intent: start_recipe_by_name
    examples: |
      - I want to cook carbonara
      - I want to make pancakes
      - recipe for lasagna
      - show me the recipe for tomato soup
      - I want to cook [omelette](nom_recette)
      - recipe for [chicken curry](nom_recette)

  - intent: add_ingredient
    examples: |
      - I have eggs
      - I have tomatoes and onions
      - in my fridge I have chicken
      - I also have rice
      - I have [eggs](liste_ingredients)
      - add [butter](liste_ingredients)
      - [tomatoes](liste_ingredients) and [onions](liste_ingredients)
      - add [milk](liste_ingredients)
      - add [flour](liste_ingredients)
      - add [sugar](liste_ingredients)
      - put in [olive oil](liste_ingredients)
      - I have [rice](liste_ingredients)
      - I have [pasta](liste_ingredients)
      - I have [tuna](liste_ingredients)
      - I have [cheese](liste_ingredients)
      - I have [parmesan](liste_ingredients)
      - I have [mozzarella](liste_ingredients)
      - I have [ham](liste_ingredients)
      - I have [bacon](liste_ingredients)
      - I have [cream](liste_ingredients)
      - I have [carrots](liste_ingredients)
      - I have [potatoes](liste_ingredients)
      - I have [mushrooms](liste_ingredients)
      - I have [spinach](liste_ingredients)
      - I have [broccoli](liste_ingredients)
      - I have [garlic](liste_ingredients)
      - I have [onion](liste_ingredients) and [garlic](liste_ingredients)
      - I have: [eggs](liste_ingredients), [milk](liste_ingredients), [butter](liste_ingredients)
      - ingredients available: [chicken](liste_ingredients) / [rice](liste_ingredients) / [carrots](liste_ingredients)
      - I have [tomatoes](liste_ingredients) + [onions](liste_ingredients) + [garlic](liste_ingredients)
      - in my fridge: [tuna](liste_ingredients) and [pasta](liste_ingredients)
      - I have [2 eggs](liste_ingredients)
      - I have [1 liter of milk](liste_ingredients)
      - I have some [butter](liste_ingredients)
      - I have [flour](liste_ingredients)
      - I have [olive oil](liste_ingredients) and [balsamic vinegar](liste_ingredients)
      - I have [mustard](liste_ingredients)
      - I have [soy sauce](liste_ingredients)
      - I have [ketchup](liste_ingredients)
      - I have [mayonnaise](liste_ingredients)
      - I have [bacon](liste_ingredients)
      - I have [salmon](liste_ingredients)
      - I have [lentils](liste_ingredients)
      - I have [chickpeas](liste_ingredients)
      - I have [mushrooms](liste_ingredients) and [onions](liste_ingredients)
      - I have [spinach](liste_ingredients)
      - I have [broccoli](liste_ingredients)
      - I have [potatoes](liste_ingredients)
      - I have [bread](liste_ingredients)
      - my ingredients are: [eggs](liste_ingredients), [milk](liste_ingredients), [butter](liste_ingredients), [flour](liste_ingredients)

  - intent: done_ingredients
    examples: |
      - that's all
      - I'm done
      - no more
      - nothing else
      - finished
      - that's everything

  - intent: choose_recipe
    examples: |
      - option 1
      - option 2
      - option 3
      - the first one
      - the second one
      - the third one
      - I choose option 2
      - let's do carbonara

  - intent: ask_full_recipe
    examples: |
      - read the full recipe
      - give me the whole recipe
      - list all the steps
      - show everything at once

  - intent: start_step_by_step
    examples: |
      - step by step
      - guide me step by step
      - one step at a time
      - let's do it step by step

  - intent: next_step
    examples: |
      - next
      - next step
      - continue
      - go on
      - done
      - ok next

  - intent: repeat_step
    examples: |
      - repeat
      - say it again
      - can you repeat
      - repeat the step
      - again please

  - intent: ask_definition
    examples: |
      - what does "brown" mean
      - what does "simmer" mean
      - how do I know it's cooked
      - what is dorer
      - how to chop an onion
