version: "2.0"

nlu:
  - intent: greet
    examples: |
      - hey
      - bonjour
      - salut
      - bon matin
      - bonsoir

  - intent: goodbye
    examples: |
      - au revoir
      - à bientôt
      - à plus tard
      - bonne journée

  - intent: affirm
    examples: |
      - oui
      - ouais
      - c'est ça
      - correct
      - ok
      - d'accord

  - intent: deny
    examples: |
      - non
      - nan
      - pas vraiment
      - jamais

  - intent: start_fridge_mode
    examples: |
      - je veux cuisiner avec ce que j'ai
      - qu'est-ce que je peux faire avec mes ingrédients
      - suggère-moi des recettes avec le frigo
      - utilise mes ingrédients du frigo
      - qu'est-ce que je peux faire maintenant

  - intent: start_recipe_by_name
    examples: |
      - je veux faire une carbonara
      - je veux faire des crêpes
      - recette de lasagnes
      - montre-moi la recette de soupe à la tomate
      - je veux cuisiner une [omelette](nom_recette)
      - recette de [poulet au curry](nom_recette)

  - intent: add_ingredient
    examples: |
      - j'ai des œufs
      - j'ai des tomates et des oignons
      - dans mon frigo j'ai du poulet
      - j'ai aussi du riz
      - j'ai des [œufs](liste_ingredients)
      - ajoute du [beurre](liste_ingredients)
      - des [tomates](liste_ingredients) et des [oignons](liste_ingredients)
      - ajoute des [œufs](liste_ingredients)
      - ajoute du [lait](liste_ingredients)
      - ajoute de la [farine](liste_ingredients)
      - mets du [sucre](liste_ingredients)
      - mets du [beurre](liste_ingredients)
      - j'ai de l'[huile d'olive](liste_ingredients)
      - j'ai du [riz](liste_ingredients)
      - j'ai des [pâtes](liste_ingredients)
      - j'ai des [tomates](liste_ingredients)
      - j'ai des [oignons](liste_ingredients)
      - j'ai de l'[ail](liste_ingredients)
      - j'ai du [thon](liste_ingredients)
      - j'ai du [jambon](liste_ingredients)
      - il me reste des [lardons](liste_ingredients)
      - j'ai du [fromage](liste_ingredients)
      - j'ai du [parmesan](liste_ingredients)
      - j'ai de la [mozzarella](liste_ingredients)
      - j'ai une [crème fraîche](liste_ingredients)
      - j'ai des [carottes](liste_ingredients)
      - j'ai des [pommes de terre](liste_ingredients)
      - j'ai une [courgette](liste_ingredients)
      - j'ai une [aubergine](liste_ingredients)
      - j'ai des [champignons](liste_ingredients)
      - j'ai des [épinards](liste_ingredients)
      - j'ai du [brocoli](liste_ingredients)
      - j'ai un [citron](liste_ingredients)
      - j'ai du [pain](liste_ingredients)
      - j'ai : [œufs](liste_ingredients), [lait](liste_ingredients), [beurre](liste_ingredients)
      - ingrédients : [poulet](liste_ingredients) / [riz](liste_ingredients) / [carotte](liste_ingredients)
      - j'ai [tomates](liste_ingredients) + [oignons](liste_ingredients) + [ail](liste_ingredients)
      - dans mon frigo : du [thon](liste_ingredients) et des [pâtes](liste_ingredients)
      - il me reste [2 œufs](liste_ingredients)
      - j'ai [1 litre de lait](liste_ingredients)
      - j'ai un peu de [beurre](liste_ingredients)
      - j'ai un sachet de [farine](liste_ingredients)
      - j'ai de l'[huile d'olive](liste_ingredients) et du [vinaigre balsamique](liste_ingredients)
      - j'ai de la [moutarde](liste_ingredients)
      - j'ai de la [sauce soja](liste_ingredients)
      - j'ai du [parmesan](liste_ingredients) et du [fromage râpé](liste_ingredients)
      - j'ai des [poivrons](liste_ingredients)
      - j'ai des [champignons](liste_ingredients) et des [oignons](liste_ingredients)
      - j'ai du [saumon](liste_ingredients)
      - j'ai du [bacon](liste_ingredients)
      - j'ai des [lentilles](liste_ingredients)
      - j'ai des [pois chiches](liste_ingredients)
      - j'ai une [échalote](liste_ingredients)
      - j'ai un [poireau](liste_ingredients)
      - j'ai du [boulgour](liste_ingredients)
      - j'ai du [quinoa](liste_ingredients)
      - j'ai du [pain](liste_ingredients)
      - voici ma liste : [œufs](liste_ingredients), [lait](liste_ingredients), [beurre](liste_ingredients), [farine](liste_ingredients)

  - intent: done_ingredients
    examples: |
      - c'est tout
      - j'ai terminé
      - rien d'autre
      - c'est fini
      - c'est tout

  - intent: choose_recipe
    examples: |
      - option 1
      - option 2
      - option 3
      - la première
      - la deuxième
      - la troisième
      - je choisis l'option 2
      - faisons une carbonara

  - intent: ask_full_recipe
    examples: |
      - lis la recette complète
      - donne-moi toute la recette
      - liste toutes les étapes
      - montre tout d'un coup

  - intent: start_step_by_step
    examples: |
      - étape par étape
      - guide-moi étape par étape
      - une étape à la fois
      - faisons-le étape par étape

  - intent: next_step
    examples: |
      - suivant
      - étape suivante
      - continue
      - vas-y
      - c'est fait
      - ok suivant

  - intent: repeat_step
    examples: |
      - répète
      - répète s'il te plaît
      - peux-tu répéter
      - redis l'étape
      - encore s'il te plaît

  - intent: ask_definition
    examples: |
      - qu'est-ce que "dorer" veut dire
      - qu'est-ce que "mijoter" veut dire
      - comment savoir si c'est cuit
      - qu'est-ce que "revenir"
      - comment émincer un oignon
