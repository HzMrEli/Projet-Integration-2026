version: "2.0"

nlu:
  - intent: greet
    examples: |
      - hey
      - bonjour
      - salut
      - bon matin
      - bonsoir

  - intent: goodbye
    examples: |
      - au revoir
      - à bientôt
      - à plus tard
      - bonne journée

  - intent: affirm
    examples: |
      - oui
      - ouais
      - c'est ça
      - correct
      - ok
      - d'accord

  - intent: deny
    examples: |
      - non
      - nan
      - pas vraiment
      - jamais

  - intent: start_fridge_mode
    examples: |
      - je veux cuisiner avec ce que j'ai
      - qu'est-ce que je peux faire avec mes ingrédients
      - suggère-moi des recettes avec le frigo
      - utilise mes ingrédients du frigo
      - qu'est-ce que je peux faire maintenant

  - intent: start_recipe_by_name
    examples: |
      - je veux faire une carbonara
      - je veux faire des crêpes
      - recette de lasagnes
      - montre-moi la recette de soupe à la tomate
      - je veux cuisiner une [omelette](recipe_name)
      - recette de [poulet au curry](recipe_name)

  - intent: add_ingredient
    examples: |
      - j'ai des œufs
      - j'ai des tomates et des oignons
      - dans mon frigo j'ai du poulet
      - j'ai aussi du riz
      - j'ai des [œufs](ingredient)
      - ajoute du [beurre](ingredient)
      - des [tomates](ingredient) et des [oignons](ingredient)

  - intent: done_ingredients
    examples: |
      - c'est tout
      - j'ai terminé
      - rien d'autre
      - c'est fini
      - c'est tout

  - intent: choose_recipe
    examples: |
      - option 1
      - option 2
      - option 3
      - la première
      - la deuxième
      - la troisième
      - je choisis l'option 2
      - faisons une carbonara

  - intent: ask_full_recipe
    examples: |
      - lis la recette complète
      - donne-moi toute la recette
      - liste toutes les étapes
      - montre tout d'un coup

  - intent: start_step_by_step
    examples: |
      - étape par étape
      - guide-moi étape par étape
      - une étape à la fois
      - faisons-le étape par étape

  - intent: next_step
    examples: |
      - suivant
      - étape suivante
      - continue
      - vas-y
      - c'est fait
      - ok suivant

  - intent: repeat_step
    examples: |
      - répète
      - répète s'il te plaît
      - peux-tu répéter
      - redis l'étape
      - encore s'il te plaît

  - intent: pause_recipe
    examples: |
      - pause
      - attends
      - un moment
      - arrête un instant

  - intent: resume_recipe
    examples: |
      - reprends
      - continue maintenant
      - je suis de retour
      - continuons

  - intent: slow_down
    examples: |
      - plus lentement
      - parle plus lentement
      - plus lentement s'il te plaît
      - ralentis

  - intent: ask_definition
    examples: |
      - qu'est-ce que "dorer" veut dire
      - qu'est-ce que "mijoter" veut dire
      - comment savoir si c'est cuit
      - qu'est-ce que "revenir"
      - comment émincer un oignon
