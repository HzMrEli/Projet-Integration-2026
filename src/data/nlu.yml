version: "2.0"

nlu:
  - intent: greet
    examples: |
      - hey
      - bonjour
      - salut
      - bon matin
      - bonsoir

  - intent: goodbye
    examples: |
      - au revoir
      - à bientôt
      - à plus tard
      - bonne journée

  - intent: affirm
    examples: |
      - oui
      - ouais
      - c'est ça
      - correct
      - ok
      - d'accord

  - intent: deny
    examples: |
      - non
      - nan
      - pas vraiment
      - jamais

  - intent: start_fridge_mode
    examples: |
      - je veux cuisiner avec ce que j'ai
      - qu'est-ce que je peux faire avec mes ingrédients
      - suggère-moi des recettes avec le frigo
      - utilise mes ingrédients du frigo
      - qu'est-ce que je peux faire maintenant

  - intent: start_recipe_by_name
    examples: |
      - je veux faire une carbonara
      - je veux faire des crêpes
      - recette de lasagnes
      - montre-moi la recette de soupe à la tomate
