version: "2.0"

stories:
  - story: frigo -> ingrédients -> génération recette
    steps:
      - intent: greet
      - action: utter_greet
      - intent: start_fridge_mode
      - action: utter_ask_ingredients_collect
      - intent: add_ingredient
      - action: utter_confirm_ingredients
      - intent: done_ingredients
      - action: action_generate_recipe_from_ingredients

  - story: utilisateur donne directement des ingrédients -> génération recette
    steps:
      - intent: add_ingredient
      - action: utter_confirm_ingredients
      - intent: done_ingredients
      - action: action_generate_recipe_from_ingredients

  - story: recette par nom -> génération recette
    steps:
      - intent: greet
      - action: utter_greet
      - intent: start_recipe_by_name
      - action: action_generate_recipe_from_name

  - story: guidage étape par étape
    steps:
      - intent: start_step_by_step
      - action: action_tell_recipe_step
      - intent: next_step
      - action: action_tell_recipe_step
      - intent: repeat_step
      - action: action_tell_recipe_step

  - story: pause et reprise durant le guidage
    steps:
      - intent: pause_recipe
      - action: utter_paused
      - intent: resume_recipe
      - action: utter_resumed
