version: "2.0"

rules:
  # --------------------------------------------------------------------------
  # After custom actions, always present the generated recipe
  # --------------------------------------------------------------------------
  - rule: Après génération (ingrédients) -> proposer la recette
    steps:
      - action: action_generate_recipe_from_ingredients
      - action: utter_recipe_ingredients
      - action: action_text_to_speech

  - rule: Après génération (nom) -> proposer la recette
    steps:
      - action: action_generate_recipe_from_name
      - action: utter_recipe_found_details
      - action: action_text_to_speech

  # --------------------------------------------------------------------------
  # Critical transition: user accepts the proposed recipe
  # --------------------------------------------------------------------------
  - rule: Après proposition de recette (ingrédients) + oui -> demander complet ou étape par étape
    steps:
      - action: utter_recipe_ingredients
      - action: action_text_to_speech
      - intent: affirm
      - action: utter_ask_full_or_step
      - action: action_text_to_speech

  - rule: Après proposition de recette (nom) + oui -> demander complet ou étape par étape
    steps:
      - action: utter_recipe_found_details
      - action: action_text_to_speech
      - intent: affirm
      - action: utter_ask_full_or_step
      - action: action_text_to_speech

  # --------------------------------------------------------------------------
  # Critical transition: user refuses the proposed recipe
  # --------------------------------------------------------------------------
  - rule: Après proposition de recette (ingrédients) + non -> proposer une autre recette
    steps:
      - action: utter_recipe_ingredients
      - action: action_text_to_speech
      - intent: deny
      - action: utter_propose_another_recipe
      - action: action_text_to_speech
      - action: action_generate_recipe_from_ingredients
      - action: utter_recipe_ingredients
      - action: action_text_to_speech

  - rule: Après proposition de recette (nom) + non -> demander un autre nom de recette
    steps:
      - action: utter_recipe_found_details
      - action: action_text_to_speech
      - intent: deny
      - action: utter_ask_other_recipe_name
      - action: action_text_to_speech

  # --------------------------------------------------------------------------
  # Choice after utter_ask_full_or_step
  # --------------------------------------------------------------------------
  - rule: Choix guidage étape par étape
    steps:
      - action: utter_ask_full_or_step
      - action: action_text_to_speech
      - intent: start_step_by_step
      - action: utter_ask_ready_to_start
      - action: action_text_to_speech

  - rule: Choix recette complète
    steps:
      - action: utter_ask_full_or_step
      - action: action_text_to_speech
      - intent: ask_full_recipe
      - action: action_tell_full_recipe
      - action: action_text_to_speech

  # --------------------------------------------------------------------------
  # Ready-to-start gate
  # --------------------------------------------------------------------------
  - rule: Prêt à commencer + oui -> première étape
    steps:
      - action: utter_ask_ready_to_start
      - action: action_text_to_speech
      - intent: affirm
      - action: action_tell_recipe_step
      - action: action_text_to_speech

  - rule: Prêt à commencer + non -> attendre
    steps:
      - action: utter_ask_ready_to_start
      - action: action_text_to_speech
      - intent: deny
      - action: utter_waiting_ready
      - action: action_text_to_speech

  # --------------------------------------------------------------------------
  # Navigation commands (always work, regardless of long conversation history)
  # --------------------------------------------------------------------------
  - rule: Étape suivante
    steps:
      - intent: next_step
      - action: action_tell_recipe_step
      - action: action_text_to_speech

  - rule: Répéter l'étape
    steps:
      - intent: repeat_step
      - action: action_tell_recipe_step
      - action: action_text_to_speech

  - rule: Demande de définition
    steps:
      - intent: ask_definition
      - action: utter_ask_definition
      - action: action_text_to_speech

  # --------------------------------------------------------------------------
  # NLU fallback intent
  # --------------------------------------------------------------------------
  - rule: NLU fallback -> message de clarification
    steps:
      - intent: nlu_fallback
      - action: utter_fallback
      - action: action_text_to_speech
